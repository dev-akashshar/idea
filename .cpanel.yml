---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/akashsha/idea.akashshar.xyz
    - /bin/cp -R idea/* $DEPLOYPATH/
    - /bin/cp idea/.htaccess $DEPLOYPATH/ 2>/dev/null || true
    - cd $DEPLOYPATH
    - /bin/touch database/database.sqlite 2>/dev/null || true
    - /bin/chmod 775 database 2>/dev/null || true
    - /bin/chmod 664 database/database.sqlite 2>/dev/null || true
    - php artisan migrate --force
    - php artisan db:seed --force 2>/dev/null || true
    - php artisan storage:link 2>/dev/null || true
    - php artisan optimize:clear 2>/dev/null || true
    - php artisan config:cache 2>/dev/null || true
    - php artisan route:cache 2>/dev/null || true
    - php artisan view:cache 2>/dev/null || true
